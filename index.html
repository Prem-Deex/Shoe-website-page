<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shoe website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">NIKE</div>

            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Men</a>
                <a href="#">Women</a>
                <a href="#">Collection</a>
                <a href="#">Contact</a>
            </nav>

            <div class="nav-icons">
               <i class="fa-solid fa-magnifying-glass"></i>
               <i class="fa-solid fa-cart-arrow-down"></i>
            </div>
        </div>
    </header>

    <main>
        <section class="images">
            <aside>
                <img src="img/side_image1.png" alt="1">
                <img src="img/side_image2.png" alt="2">
                <img src="img/side_image3.png" alt="3">
                <img src="img/side_image4.png" alt="4">
                <img src="img/side_image5.png" alt="5">
                <img src="img/side_image6.png" alt="6">
            </aside>
            <section class="main_img">
                <img src="img/center_image.png" alt="mainshoe">
            </section>
            <section class="content">

                <div class="content_header">
                    <h2 class="header">Sustainable Material</h2>

                    <h1>NIKE REVOLUTION 8</h1>
                    <hr>
                    <p>Men's Road Running Shoes</p>
                    <div class="pricing">
                        <h2>MRP - $0.00</h2>
                        <p>Inclusive of all taxes <br>also includes all applicabel device</p>
                    </div>


                </div>
                <section class="var">
                    <img class="var_img" src="img/variant1.png" alt="">
                    <img class="var_img" src="img/variant2.png" alt="">
                    <img class="var_img" src="img/variant3.png" alt="">
                    <img class="var_img" src="img/variant4.png" alt="">

                </section>

                <section class="sizes_header">
                    <h4>Select Size</h4>
                    <h4>Size Guide</h4>
                </section>

                <section class="sizes">
                    <div class="size">6</div>
                    <div class="size">7</div>

                    <div class="size">8</div>
                    <div class="size">9</div>
                </section>
                <section class="buttons">
                    <button class="add_to_cart">Add to cart</button>
                    <button class="buynow">Buy Now</button>
                </section>
            </section>

        </section>
    </main>

</body>

</html>
